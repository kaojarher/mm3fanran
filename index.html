let walk=null,wmark=null;const ray=new THREE.Raycaster(),_nd=new THREE.Vector2();
function cancelWalk(){walk=null;if(wmark){if(wmark.parent)wmark.parent.remove(wmark);wmark=null}}
const walkable=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!g[y][x];
const blockedCell=(x,y)=>mons.some(m=>m.x===x&&m.y===y)||npcs.some(n=>n.x===x&&n.y===y)||items.some(i=>i.x===x&&i.y===y&&BLK.includes(i.k));
function findPath(tx,ty,exact){
  const key=(x,y)=>y*W+x,prev=new Map([[key(P.x,P.y),null]]),q=[[P.x,P.y]];let best=[P.x,P.y],bd=(P.x-tx)**2+(P.y-ty)**2;
  for(let h=0;h<q.length;h++){const [x,y]=q[h];
    if(x===tx&&y===ty){best=[x,y];bd=0;break}
    const d=(x-tx)**2+(y-ty)**2;if(d<bd){bd=d;best=[x,y]}
    for(const [dx,dy] of DIRS){const a=x+dx,b=y+dy;if(!walkable(a,b)||prev.has(key(a,b)))continue;
      if(blockedCell(a,b)&&!(a===tx&&b===ty&&exact))continue;prev.set(key(a,b),[x,y]);q.push([a,b])}}
  if(exact&&bd!==0)return null;
  const path=[];let c=best;while(c&&!(c[0]===P.x&&c[1]===P.y)){path.unshift(c);c=prev.get(key(c[0],c[1]))}
  return path}
function groundCell(pt,dir){const p=pt.clone().addScaledVector(dir,-.3),l=world.worldToLocal(p);
  if(theme.pl){const pl=theme.pl,R=Math.hypot(l.x,l.y,l.z),b=Math.asin(clamp(l.z/R,-1,1)),a=Math.atan2(l.x,l.y);return[Math.round(a*pl+(W-1)/2),Math.round(b*pl+(H-1)/2)]}
  return[Math.round(l.x),Math.round(l.z)]}
function onTap(cx,cy){
  const rc=$('#gl').getBoundingClientRect(),fx=(cx-rc.left)/rc.width,fy=(cy-rc.top)/rc.height;
  if(fy>.7&&(fx<.3||fx>.7)){cancelWalk();turn(fx<.3?-1:1);return}
  _nd.set((cx-rc.left)/rc.width*2-1,-((cy-rc.top)/rc.height)*2+1);ray.setFromCamera(_nd,camera);
  const hits=ray.intersectObjects(world.children,false);let tx=null,ty=null,ent=false;
  for(const h of hits){const o=h.object;let e;
    if(e=mons.find(m=>m.s===o)){tx=e.x;ty=e.y;ent=true;break}
    if(e=npcs.find(n=>n.s===o||n.bs===o||n.ic===o)){tx=e.x;ty=e.y;ent=true;break}
    if(e=items.find(i=>i.s===o&&i.s.visible)){tx=e.x;ty=e.y;ent=true;break}
    if(o.isMesh){[tx,ty]=groundCell(h.point,ray.ray.direction);break}}
  if(tx===null)return;
  tx=clamp(tx,0,W-1);ty=clamp(ty,0,H-1);if(tx===P.x&&ty===P.y)return;
  let path=findPath(tx,ty,ent);if(!path&&ent)path=findPath(tx,ty,false);
  if(!path||!path.length){if(ent){say('🚫 走不到那裡。')}return}
  cancelWalk();const end=path[path.length-1];
  wmark=sprite(ent?'🎯':'📍',.35);world.add(wmark);put(wmark,end[0],.3,end[1]);
  walk={path,key:K(area,FL),tx:end[0],ty:end[1]};sfx('click')}
setInterval(()=>{if(!walk)return;
  if(over||combat||menu||walk.key!==K(area,FL)){cancelWalk();return}
  if(busy())return;
  const nx=walk.path&&walk.path[0];if(!nx){cancelWalk();return}
  const dx=nx[0]-P.x,dy=nx[1]-P.y;if(Math.abs(dx)+Math.abs(dy)!==1){cancelWalk();return}
  if(walk.path.length>1&&blockedCell(nx[0],nx[1])){cancelWalk();return}
  const d=DIRS.findIndex(v=>v[0]===dx&&v[1]===dy);
  if(P.d!==d){const df=(d-P.d+4)%4;turn(df===3?-1:1);return}
  const k0=walk.key;move('f');
  if(walk&&k0===K(area,FL)&&P.x===nx[0]&&P.y===nx[1]){walk.path.shift();if(!walk.path.length)cancelWalk()}else cancelWalk()},50);
{let pd=null;const gl=$('#gl');gl.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY}});

  $('#party').innerHTML=party.map((p,i)=>`<div class="card${combat&&combat.i===i?' act':''}${p.hp?'':' dead'}"><b>${p.hp?p.e:'💀'} ${p.n} <small>Lv${p.lv}</small> ${stBar(p)}</b><div class="br"><i><u class="hp" style="width:${p.hp/p.mhp*100}%"></u></i><em>${p.hp}/${p.mhp}</em></div><div class="br"><i><u class="mp" style="width:${p.mp/p.mmp*100}%"></u></i><em>${p.mp}/${p.mmp}</em></div><span>⚔️${atkOf(p)} 🛡️${E(p).def}</span></div>`).join('')+'<div class="card empty">空位</div>'.repeat((4-party.length%4)%4);
  $('#mv').hidden=!!combat;$('#cb').hidden=!combat;$('#fight').hidden=!combat;$('#foes').hidden=!combat;$('#view').classList.toggle('fight',!!combat);$('#app').classList.toggle('cmb',!!combat);
  if(combat)fightUI();else $('#log').style.bottom='';
  $('#log').innerHTML=logs.slice(-(combat?3:4)).map(l=>`<div>${l}</div>`).join('');mini();clearTimeout(asT);asT=setTimeout(autosave,500)}

// ===== 存檔 =====
const AUTO='fr_auto1',SLOT=i=>'fr_s1_'+i;
function snap(){AR[K(area,FL)].P={...P};const areas={};
  for(const k in AR){const a=AR[k];areas[k]=a.nm==='village'?{nm:'village',fl:1,P:a.P}:{nm:a.nm,fl:a.fl,g:a.g,vis:a.vis,P:a.P,mod:a.mod,mons:a.mons.map(m=>({x:m.x,y:m.y,e:m.e,n:m.n,hp:m.hp,mhp:m.mhp,atk:m.atk,spd:m.spd,sp:m.sp,boss:!!m.boss})),items:a.items.map(i=>({x:i.x,y:i.y,k:i.k,stock:i.stock}))}}
  return{v:2,t:Date.now(),gold,camps,bonus,cons,keys,quest,offers,deep,done,won,bless,dex,ach,kills,qdone,ng,inv,party,pool,camp,ret,area,fl:FL,areas,logs:logs.slice(-4)}}
const summary=d=>`${NM[d.area]}${d.fl>1?' 第'+d.fl+'層':''} 隊伍${d.party.length}+${d.camp.length} 💰${d.gold}　${new Date(d.t).toLocaleString('zh-TW',{hour12:false})}`;
function valid(d){return d&&d.v===2&&Array.isArray(d.party)&&d.party.length&&Array.isArray(d.pool)&&Array.isArray(d.camp)&&Array.isArray(d.inv)&&d.areas&&d.areas[K(d.area,d.fl)]&&d.areas['village:1']&&NM[d.area]&&d.cons&&d.deep}
function applySave(d){
  if(!valid(d))throw new Error('bad');
  resetWorld();
  ({gold,camps,bonus,cons,keys,quest,offers,deep,done,won,bless,dex,ach,kills,qdone,ng,inv,party,pool,camp}=d);keys=keys||0;bless=bless||0;
  logs=d.logs||[];
  for(const k in d.areas){const a=d.areas[k];build(a.nm,a.nm==='village'?null:a,a.fl);AR[k].P=a.P}
  go(d.area,AR[K(d.area,d.fl)].P,d.fl);ret=d.ret||null;recalcAll();say('📂 已讀取存檔。')}
function loadSlot(k){const raw=lsGet(k);if(!raw){say('沒有存檔。');return}try{applySave(JSON.parse(raw))}catch(e){console.error(e);say('❌ 存檔損毀，無法讀取。')}}
function saveSlot(i){const ok=lsSet(SLOT(i),JSON.stringify(snap()));say(ok?`💾 已存入欄位 ${i}。`:'❌ 瀏覽器不允許儲存，請改用「匯出存檔檔案」。');saveMenu()}
function autosave(){if(combat||menu||over||!area||!party)return;lsSet(AUTO,JSON.stringify(snap()))}
function exportSave(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snap())],{type:'application/json'}));a.download='凡人修仙傳存檔.json';document.body.appendChild(a);a.click();a.remove();say('⬇️ 已匯出存檔檔案。')}
function saveMenu(){const rows=[],sm=raw=>{try{return raw?summary(JSON.parse(raw)):'空'}catch(e){return'（損毀）'}};
  for(let i=1;i<=3;i++){const raw=lsGet(SLOT(i));rows.push([`💾 存入欄位 ${i}　${sm(raw)}`,()=>saveSlot(i)]);rows.push([`📂 讀取欄位 ${i}`,()=>{closeMenu();loadSlot(SLOT(i))},!raw])}
  const a=lsGet(AUTO);rows.push([`📂 讀取自動存檔　${sm(a)}`,()=>{closeMenu();loadSlot(AUTO)},!a]);
  rows.push(['⬇️ 匯出存檔檔案',exportSave]);rows.push(['⬆️ 匯入存檔檔案',()=>$('#imp').click()]);
  menuOpen('💾 存檔／讀檔（進度也會自動存檔）',rows)}

// ===== 輸入 =====
function cycTgt(){if(!combat||combat.lock)return;const n=combat.foes.length;for(let k=1;k<=n;k++){const i=(combat.tg+k)%n;if(combat.foes[i].hp>0){combat.tg=i;break}}ui()}
const A={f:()=>move('f'),b:()=>move('b'),l:()=>move('l'),r:()=>move('r'),tl:()=>turn(-1),tr:()=>turn(1),rest,tp:portal,save:()=>{if(over||combat||menu)return;saveMenu()},bag:()=>{if(over||combat||menu)return;bagMenu()},book:()=>{if(over||combat||menu)return;bookMenu()},set:()=>{if(over||combat||menu)return;setMenu()},
  atk:()=>act('atk'),sk:()=>act('sk'),def:()=>act('def'),item:()=>act('item'),run:()=>act('run'),tgt:cycTgt};
$('#ctrl').addEventListener('click',e=>{cancelWalk();const b=e.target.closest('button');if(b&&A[b.dataset.k])A[b.dataset.k]()});
$('#foes').addEventListener('click',e=>{const d=e.target.closest('.fo');if(!d||!combat||combat.lock)return;const i=+d.dataset.f;if(combat.foes[i].hp>0){combat.tg=i;sfx('click');ui()}});
$('#again').onclick=()=>{if(confirm('開始全新的遊戲？（自動存檔會在下次行動時被覆蓋）'))newGame()};$('#ld').onclick=()=>loadSlot(AUTO);$('#cont').onclick=endContinue;$('#ngp').onclick=()=>{newGamePlus()};
$('#imp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(t=>{try{applySave(JSON.parse(t))}catch(x){say('❌ 匯入失敗：不是有效的存檔檔案。')}})};
const fsb=$('#fs'),de=document.documentElement;if(!de.requestFullscreen&&!de.webkitRequestFullscreen)fsb.hidden=true;
fsb.onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(de.requestFullscreen||de.webkitRequestFullscreen).call(de)};
const KM={w:'f',arrowup:'f',s:'b',arrowdown:'b',a:'tl',arrowleft:'tl',d:'tr',arrowright:'tr',q:'l',e:'r',r:'rest',t:'tp',p:'save',i:'bag',m:'book',o:'set',x:'tgt',tab:'tgt','1':'atk','2':'sk','3':'def','4':'item','5':'run'};
addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){closeMenu();return}const k=KM[e.key.toLowerCase()];if(k){e.preventDefault();cancelWalk();A[k]()}});

function rs(){const w=view.clientWidth,h=view.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}
new ResizeObserver(rs).observe(view);rs();
function tick(t){requestAnimationFrame(tick);
  vx+=(tgt.x-vx)*.2;vz+=(tgt.z-vz)*.2;camera.rotation.y+=(tgt.a-camera.rotation.y)*.2;placeCam();
  if(area==='village'){syncCamp(t);syncPortal(t)}torch.intensity=theme.torch+Math.sin(t/90)*.07+Math.random()*.04;
  mons.forEach(m=>put(m.s,m.x,(m.boss?.5:.42)+Math.sin(t/300+m.x)*.03,m.y));
  npcs.forEach(n=>{if(!n.s)return;if(!n.st&&t>n.nx&&t>n.t0+1400){n.nx=t+1500+Math.random()*3000;const [dx,dy]=DIRS[r(0,3)],x=n.x+dx,y=n.y+dy;if(!g[y][x]&&Math.abs(x-n.home[0])+Math.abs(y-n.home[1])<=2&&!(x===P.x&&y===P.y)&&!npcs.some(o=>o!==n&&o.x===x&&o.y===y)){n.fx=n.x;n.fy=n.y;n.x=x;n.y=y;n.t0=t;if(dx)n.fl=dx}}const k0=Math.min(1,(t-n.t0)/1400),k=k0*k0*(3-2*k0);put(n.s,n.fx+(n.x-n.fx)*k,.25,n.fy+(n.y-n.fy)*k);n.s.scale.x=.5;if(n.ic){const f=n.s.userData.f;put(n.ic,f[0],.62,f[2])}});
  items.forEach(i=>{if(i.k==='down'||i.k==='merchant'||i.k==='shrine')put(i.s,i.x,.45+Math.sin(t/400+i.x)*.04,i.y)});
  renderer.render(scene,camera)}
window.__dbg={get S(){return{gold,party,camp,combat,area,FL,P,over,menu,mons,items,deep,quest,dex,ach,AR,inv,cons,ng,won}},act,move,A,applySave,snap,startCombat,gainXp,victory,build,go,newGame,ui,pick,mkItem,giveItem,defeat,endContinue,newGamePlus,sfx,tpl,setLv};
newGame();requestAnimationFrame(tick);
{const a=lsGet(AUTO);if(a)try{const d=JSON.parse(a);if(valid(d))menuOpen(`📂 發現自動存檔<br><small>${summary(d)}<br>選「離開」將開始新遊戲</small>`,[['📂 繼續上次進度',()=>{closeMenu();loadSlot(AUTO)}]]);else if(!set.seen){set.seen=1;saveSet();helpMenu(0)}}catch(e){}else if(!set.seen){set.seen=1;saveSet();helpMenu(0)}}
